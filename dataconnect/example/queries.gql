query ListAiInteractions @auth(level: USER) {
  aiInteractions(where: { userId: { eq_expr: "auth.uid" } }, orderBy: [{ createdAt: DESC }], limit: 50) {
    id
    modelUsed
    promptContent
    responseContent
    promptTokens
    completionTokens
    latencyMs
    createdAt
  }
}

query GetAnalyticsPageDailyTop($dayKey: String!) @auth(level: USER) {
  analyticsPageDailies(
    where: { dayKey: { eq: $dayKey } }
    orderBy: [{ pageViews: DESC }]
    limit: 25
  ) {
    id
    dayKey
    pagePath
    pageViews
    clickCount
    hoverCount
    dwellMsTotal
    dwellSampleCount
    maxScrollDepth
    lastEventAtMs
  }
}

query GetAnalyticsDropDailyTop($dayKey: String!) @auth(level: USER) {
  analyticsDropDailies(
    where: { dayKey: { eq: $dayKey } }
    orderBy: [{ unwrapCount: DESC }, { eventCount: DESC }]
    limit: 25
  ) {
    id
    dayKey
    dropId
    dropTitle
    dropCategory
    eventCount
    viewerSessionCount
    unwrapCount
    downloadCount
    relatedClickCount
    spendGdTotal
    watchSecondsTotal
    lastEventAtMs
  }
}
