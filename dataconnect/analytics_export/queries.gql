query GetAnalyticsExportStatuses {
  analyticsExportStatuses(
    orderBy: [{ domain: ASC }]
    limit: 50
  ) {
    id
    domain
    sourceCollection
    sourceKey
    timeZone
    exportVersion
    status
    lastSourceUpdatedAtMs
    lastExportedAtMs
    lastError
  }
}

query ListAnalyticsExportCommerceDaily(
  $startDayKey: String!
  $limit: Int! = 90
) {
  analyticsCommerceDailies(
    where: { dayKey: { gte: $startDayKey } }
    orderBy: [{ dayKey: DESC }]
    limit: $limit
  ) {
    id
    dayKey
    transactionCount
    purchaseCount
    unlockCount
    grossRevenueUsdTotal
    paypalFeeUsdTotal
    paypalFeeCentsTotal
    netRevenueUsdTotal
    netRevenueCentsTotal
    adjustedProfitUsdTotal
    bonusValueUsdTotal
    bonusGumDropsTotal
    deliveredGumDropsTotal
    paidGumDropsTotal
    spendGdTotal
    unlockSpendGdTotal
    lastTransactionAtMs
  }
}

query GetAnalyticsExportCommerceRollup {
  analyticsCommerceRollups(limit: 1) {
    id
    transactionCount
    purchaseCount
    unlockCount
    grossRevenueUsdTotal
    paypalFeeUsdTotal
    paypalFeeCentsTotal
    netRevenueUsdTotal
    netRevenueCentsTotal
    adjustedProfitUsdTotal
    bonusValueUsdTotal
    bonusGumDropsTotal
    deliveredGumDropsTotal
    paidGumDropsTotal
    unlockSpendGdTotal
    lastTransactionAtMs
  }
}

