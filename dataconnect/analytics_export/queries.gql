query ListAnalyticsExportAlerts($limit: Int! = 50) {
  analyticsAlerts(
    orderBy: [{ generatedAtMs: DESC }]
    limit: $limit
  ) {
    id
    hourKey
    type
    severity
    message
    baseline
    current
    generatedAtMs
  }
}

query ListAnalyticsExportAlertsByHourKey($hourKey: String!) {
  analyticsAlerts(
    where: { hourKey: { eq: $hourKey } }
    orderBy: [{ type: ASC }]
    limit: 50
  ) {
    id
    type
    hourKey
  }
}
