query GetAnalyticsExportTopPagesByDay(
  $dayKey: String!
  $limit: Int! = 25
) {
  analyticsPageDailies(
    where: { dayKey: { eq: $dayKey } }
    orderBy: [{ pageViews: DESC }, { clickCount: DESC }]
    limit: $limit
  ) {
    id
    dayKey
    pagePath
    pageViews
    clickCount
    hoverCount
    scrollCount
    visibilityCount
    dwellMsTotal
    dwellSampleCount
    maxScrollDepth
    lastEventAtMs
  }
}

