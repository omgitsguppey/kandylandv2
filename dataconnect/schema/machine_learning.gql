# Machine Learning Interaction Tracking Schema
# Stores AI prompt/response pairs for analytics and future model fine-tuning

type AIInteraction @table(name: "ai_interactions") {
  id: UUID! @default(expr: "uuidV4()")
  userId: String!
  modelUsed: String!
  promptContent: String!
  responseContent: String!
  promptTokens: Int
  completionTokens: Int
  latencyMs: Int!
  createdAt: Date! @default(expr: "request.time")
}
