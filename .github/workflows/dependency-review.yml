name: Dependency Review

on:
  workflow_dispatch:

# Manual fallback only while GitHub-hosted runner billing is not a reliable
# source of truth. Dependency gates should run in the Cloud Build CI lane or by
# local targeted validators before merge.
#
# Dependency manifest scope:
# - package.json
# - package-lock.json
# - functions/package.json
# - functions/package-lock.json
# - .github/workflows/**

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
