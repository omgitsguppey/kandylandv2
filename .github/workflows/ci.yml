name: CI

on:
  workflow_dispatch:

# Automated CI truth now belongs to Cloud Build through cloudbuild.yaml.
# Keep this GitHub workflow as a manual fallback only; GitHub-hosted runners can
# fail before checkout when account runner billing is locked.

permissions:
  contents: read
  pull-requests: read

jobs:
  lightweight-pr-ci:
    name: Lightweight PR CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Plan affected audits
        run: npm run plan:affected-audits -- --task="github pull request"

      - name: Validate affected audit router
        run: npm run check:affected-audit-router

      - name: Validate human developer readiness
        run: npm run check:human-dev-readiness

      - name: Validate public beta release notes
        run: npm run check:release-notes

      - name: Typecheck
        run: npm run typecheck
