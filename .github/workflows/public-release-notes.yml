name: Public Beta Release Notes

on:
  push:
    branches:
      - main
    paths-ignore:
      - "public/kandydrops-release-notes.json"
      - "src/lib/release-notes/public-release-notes.ts"
      - "src/lib/release-notes/release-version-contract.ts"
      - "docs/agent-truth/public-beta-release-notes.md"
      - "CHANGELOG.md"
  workflow_dispatch:

# Push events are retained for paths-ignore only while GitHub hosted-runner
# billing is locked. Cloud Build owns automatic release-note normalization;
# manual workflow_dispatch remains a fallback.

permissions:
  contents: write

jobs:
  update-release-notes:
    name: Update Public Beta Release Notes
    if: ${{ github.event_name == 'workflow_dispatch' && !contains(github.event.head_commit.message || '', '[skip release-notes]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update public changelog
        run: npm run release:notes

      - name: Commit generated release notes
        run: |
          if git diff --quiet -- public/kandydrops-release-notes.json src/lib/release-notes/public-release-notes.ts src/lib/release-notes/release-version-contract.ts CHANGELOG.md; then
            echo "Release notes already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kandydrops-release-notes.json src/lib/release-notes/public-release-notes.ts src/lib/release-notes/release-version-contract.ts CHANGELOG.md
          git commit -m "chore(release): update public changelog [skip release-notes]"
          git push
