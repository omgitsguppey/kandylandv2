name: Public Beta Release Notes

on:
  workflow_dispatch:

# Cloud Build owns automatic release-note validation. Keep this GitHub Actions
# lane workflow_dispatch-only as a manual fallback so push commits do not get
# skipped or pending fallback checks that branch protection can mistake for release truth.

permissions:
  contents: read

jobs:
  update-release-notes:
    name: Update Public Beta Release Notes
    if: ${{ !contains(github.event.head_commit.message || '', '[skip release-notes]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update public changelog
        run: npm run release:notes

      - name: Verify release notes were committed with the patch
        run: |
          git diff --exit-code -- public/kandydrops-release-notes.json src/lib/release-notes/public-release-notes.ts src/lib/release-notes/release-version-contract.ts CHANGELOG.md

      - name: Validate public changelog
        run: npm run check:release-notes
