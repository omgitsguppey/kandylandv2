# KandyDrops Cloud Build public release-note validation lane.
#
# This lane verifies bundled/public changelog artifacts are already committed
# with the patch that required them. It must not create follow-up commits.
timeout: "1200s"
options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: "skip-generated-release-note-commits"
    name: "gcr.io/cloud-builders/git"
    entrypoint: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        title="$(git log -1 --format=%s)"
        changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
        if echo "$title" | grep -qi '\[skip release-notes\]'; then
          touch /workspace/.skip-release-notes
          echo "Release-note validation skipped by commit marker."
          exit 0
        fi
        release_only="true"
        for path in $changed_files; do
          case "$path" in
            public/kandydrops-release-notes.json|src/lib/release-notes/public-release-notes.ts|src/lib/release-notes/release-version-contract.ts|docs/agent-truth/public-beta-release-notes.md|CHANGELOG.md)
              ;;
            *)
              release_only="false"
              ;;
          esac
        done
        if [ "$release_only" = "true" ]; then
          touch /workspace/.skip-release-notes
          echo "Release-note validation skipped for release artifact-only commit."
        fi

  - id: "install-root-dependencies"
    name: "node:22-bookworm"
    entrypoint: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        if [ -f /workspace/.skip-release-notes ]; then
          exit 0
        fi
        npm ci

  - id: "validate-public-changelog"
    name: "node:22-bookworm"
    entrypoint: "bash"
    args:
      - "-lc"
      - |
        set -euo pipefail
        if [ -f /workspace/.skip-release-notes ]; then
          exit 0
        fi
        npm run release:notes
        git diff --exit-code -- public/kandydrops-release-notes.json src/lib/release-notes/public-release-notes.ts src/lib/release-notes/release-version-contract.ts CHANGELOG.md
        npm run check:release-notes
